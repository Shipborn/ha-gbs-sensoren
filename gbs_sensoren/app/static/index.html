<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBS Locaties</title>
<style>
  :root {
    --bg: #f4f5f7; --kaart: #fff; --tekst: #1c1f23; --zacht: #5f6670; --rand: #dde1e6;
    --accent: #264653; --accent2: #e9c46a; --rood: #b3261e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111417; --kaart: #1c2024; --tekst: #e8eaed; --zacht: #9aa1a9; --rand: #2e343a; --accent: #8ecae6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); }
  header { padding: 20px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--zacht); font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 60px; }
  .nieuw { display: flex; gap: 8px; flex-wrap: wrap; background: var(--kaart); border: 1px solid var(--rand);
           border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 180px; font: inherit; padding: 9px 11px; border-radius: 8px;
                     border: 1px solid var(--rand); background: var(--bg); color: var(--tekst); }
  button, .knop { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rand);
                  background: var(--kaart); color: var(--tekst); cursor: pointer; display: inline-flex;
                  align-items: center; gap: 6px; white-space: nowrap; }
  button.hoofd { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { button.hoofd { color: #111; } }
  button:disabled { opacity: .45; cursor: default; }
  button.gevaar { color: var(--rood); }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .loc { background: var(--kaart); border: 1px solid var(--rand); border-radius: 12px; overflow: hidden;
         display: flex; flex-direction: column; }
  .foto { position: relative; aspect-ratio: 4 / 3; background: #333; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fotoknoppen { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
  .fotoknoppen .knop { background: rgba(0,0,0,.6); color: #fff; border: 0; padding: 7px 10px; }
  /* Niet hidden/display:none: anders werkt de bestandskeuze niet in de HA Android-app */
  .bestand { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .naam { font-weight: 600; font-size: 16px; }
  .naamregel { display: flex; gap: 6px; }
  .naamregel input { min-width: 0; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent2); color: #222; font-weight: 600; }
  .chip.leeg { background: transparent; color: var(--zacht); font-weight: 400; padding-left: 0; }
  .acties { display: flex; gap: 6px; flex-wrap: wrap; }
  .acties button { padding: 6px 10px; }
  #melding { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff;
             padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s;
             pointer-events: none; max-width: 90vw; }
  #melding.zien { opacity: 1; }
  #melding.fout { background: var(--rood); }
  .bezig { opacity: .5; pointer-events: none; }
  .waarschuwing { background: #fff4ce; color: #5c4400; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>GBS Locaties</h1>
  <p>Voeg locaties toe, hernoem ze of geef ze een foto. Het dashboard <b>GBS Sensoren</b> wordt meteen bijgewerkt (ververs daar de pagina).</p>
</header>
<main>
  <div id="haWaarschuwing" class="waarschuwing" hidden>Home Assistant is niet bereikbaar: wijzigingen worden opgeslagen, maar de plaatsing van sensoren is niet zichtbaar.</div>
  <form class="nieuw" id="nieuwForm">
    <input type="text" id="nieuwNaam" maxlength="40" placeholder="Nieuwe locatie, bijv. Koelcel 2" autocomplete="off">
    <button class="hoofd" type="submit">＋ Toevoegen</button>
  </form>
  <div class="raster" id="raster"></div>
</main>
<div id="melding"></div>

<script>
let LOCATIES = [];
let BEWERK = null;  // slug van de locatie waarvan de naam bewerkt wordt

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function melding(tekst, fout = false) {
  const m = $("#melding");
  m.textContent = tekst;
  m.className = "zien" + (fout ? " fout" : "");
  clearTimeout(melding.t);
  melding.t = setTimeout(() => m.className = "", fout ? 5000 : 2500);
}

async function api(methode, pad, body, soort = "application/json") {
  $("#raster").classList.add("bezig");
  try {
    const r = await fetch(pad, {
      method: methode,
      headers: body === undefined ? {} : {"Content-Type": soort},
      body: body === undefined ? undefined : (soort === "application/json" ? JSON.stringify(body) : body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.fout || `Fout ${r.status}`);
    toon(data);
    if (data.waarschuwing) melding(data.waarschuwing, true);
    return data;
  } finally {
    $("#raster").classList.remove("bezig");
  }
}

function toon(data) {
  LOCATIES = data.locaties;
  $("#haWaarschuwing").hidden = data.ha;
  $("#raster").innerHTML = LOCATIES.map((l, n) => {
    const chips = l.sensoren.length
      ? l.sensoren.map(s => `<span class="chip">${esc(s)}</span>`).join("")
      : `<span class="chip leeg">geen sensoren</span>`;
    const naam = BEWERK === l.slug
      ? `<form class="naamregel" data-hernoem="${l.slug}">
           <input type="text" maxlength="40" value="${esc(l.naam)}" autofocus>
           <button class="hoofd" type="submit">Opslaan</button>
           <button type="button" data-annuleer>✕</button>
         </form>`
      : `<div class="naam">${esc(l.naam)}</div>`;
    const acties = l.vast ? "" : `
        <div class="acties">
          <button data-hernoemen="${l.slug}">✎ Naam</button>
          <button data-op="${n}" ${n <= 1 ? "disabled" : ""} title="Omhoog">↑</button>
          <button data-neer="${n}" ${n === LOCATIES.length - 1 ? "disabled" : ""} title="Omlaag">↓</button>
          <button class="gevaar" data-weg="${l.slug}">🗑 Verwijderen</button>
        </div>`;
    return `
      <div class="loc">
        <div class="foto">
          <img src="foto/${l.slug}.jpg?v=${l.v}" alt="">
          <div class="fotoknoppen">
            <label class="knop" for="cam-${l.slug}">📷</label>
            <input class="bestand" type="file" accept="image/*" capture="environment" id="cam-${l.slug}" data-foto="${l.slug}">
            <label class="knop" for="gal-${l.slug}">🖼 Foto</label>
            <input class="bestand" type="file" accept="image/*" id="gal-${l.slug}" data-foto="${l.slug}">
          </div>
        </div>
        <div class="info">
          ${naam}
          <div class="chips">${chips}</div>
          ${l.vast ? `<div class="chip leeg">Vaste keuze voor sensoren die nog nergens hangen</div>` : acties}
        </div>
      </div>`;
  }).join("");
  const veld = document.querySelector("[data-hernoem] input");
  if (veld) { veld.focus(); veld.select(); }
}

// Foto verkleinen in de browser (ook HEIC van iPhones wordt zo JPEG)
function verklein(bestand, max = 1600) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(bestand);
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * f);
      c.height = Math.round(img.naturalHeight * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || bestand), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(bestand); };
    img.src = url;
  });
}

async function verplaats(n, stap) {
  const slugs = LOCATIES.map(l => l.slug);
  const m = n + stap;
  if (m < 1 || m >= slugs.length) return;
  [slugs[n], slugs[m]] = [slugs[m], slugs[n]];
  await api("POST", "api/volgorde", {slugs});
}

$("#nieuwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const naam = $("#nieuwNaam").value.trim();
  if (!naam) return;
  try {
    await api("POST", "api/locaties", {naam});
    $("#nieuwNaam").value = "";
    melding(`'${naam}' toegevoegd. Geef de locatie nu een foto.`);
  } catch (err) { melding(err.message, true); }
});

$("#raster").addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  try {
    if (b.dataset.hernoemen) { BEWERK = b.dataset.hernoemen; toon({locaties: LOCATIES, ha: $("#haWaarschuwing").hidden}); }
    else if ("annuleer" in b.dataset) { BEWERK = null; toon({locaties: LOCATIES, ha: $("#haWaarschuwing").hidden}); }
    else if (b.dataset.op) await verplaats(+b.dataset.op, -1);
    else if (b.dataset.neer) await verplaats(+b.dataset.neer, 1);
    else if (b.dataset.weg) {
      const l = LOCATIES.find(x => x.slug === b.dataset.weg);
      const extra = l.sensoren.length ? `\n\n${l.sensoren.join(", ")} gaan naar 'Niet geplaatst'.` : "";
      if (!confirm(`'${l.naam}' en de foto verwijderen?${extra}`)) return;
      await api("DELETE", `api/locaties/${l.slug}`);
      melding(`'${l.naam}' verwijderd`);
    }
  } catch (err) { melding(err.message, true); }
});

$("#raster").addEventListener("submit", async e => {
  const f = e.target.closest("[data-hernoem]");
  if (!f) return;
  e.preventDefault();
  try {
    BEWERK = null;
    await api("PUT", `api/locaties/${f.dataset.hernoem}`, {naam: f.querySelector("input").value});
    melding("Naam aangepast. Sensoren op deze locatie zijn meeverhuisd.");
  } catch (err) { BEWERK = f.dataset.hernoem; melding(err.message, true); }
});

$("#raster").addEventListener("change", async e => {
  const inp = e.target.closest("[data-foto]");
  if (!inp || !inp.files.length) return;
  try {
    const blob = await verklein(inp.files[0]);
    await api("POST", `api/locaties/${inp.dataset.foto}/foto`, blob, "image/jpeg");
    melding("Foto opgeslagen");
  } catch (err) { melding(err.message, true); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && BEWERK) { BEWERK = null; toon({locaties: LOCATIES, ha: $("#haWaarschuwing").hidden}); }
});

fetch("api/locaties").then(r => r.json()).then(toon).catch(() => melding("Laden mislukt", true));
</script>
</body>
</html>
