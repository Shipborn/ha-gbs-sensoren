  # ------------------------------------------------------------ GRAFIEKEN
  - title: Grafieken
    path: grafieken
    icon: mdi:chart-line
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: history-graph
            title: Temperatuur – alle sensoren (24 u)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.gbs_t1_temperature
                name: T1
              - entity: sensor.gbs_t2_temperature
                name: T2
              - entity: sensor.gbs_t3_temperature
                name: T3
              - entity: sensor.gbs_t4_temperature
                name: T4
              - entity: sensor.gbs_a1_temperature
                name: A1
              - entity: sensor.gbs_a2_temperature
                name: A2
              - entity: sensor.gbs_a3_temperature
                name: A3
              - entity: sensor.gbs_a4_temperature
                name: A4
              - entity: sensor.gbs_a5_temperature
                name: A5
          - type: history-graph
            title: Luchtvochtigheid (24 u)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.gbs_a1_humidity
                name: A1
              - entity: sensor.gbs_a2_humidity
                name: A2
              - entity: sensor.gbs_a3_humidity
                name: A3
              - entity: sensor.gbs_a4_humidity
                name: A4
              - entity: sensor.gbs_a5_humidity
                name: A5
          - type: history-graph
            title: Luchtdruk (24 u)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.gbs_a1_pressure
                name: A1
              - entity: sensor.gbs_a2_pressure
                name: A2
              - entity: sensor.gbs_a3_pressure
                name: A3
              - entity: sensor.gbs_a4_pressure
                name: A4
              - entity: sensor.gbs_a5_pressure
                name: A5
