              entities:
                - entity: input_select.gbs_a1_locatie
                  name: Locatie (ook via foto's hieronder)
                - entity: input_text.gbs_a1_toelichting
                  name: Toelichting (bv. 'bovenste plank, links')
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_select.gbs_actieve_sensor
                state: "A2"
            card:
              type: entities
              title: "A2 – details"
              entities:
                - entity: input_select.gbs_a2_locatie
                  name: Locatie (ook via foto's hieronder)
                - entity: input_text.gbs_a2_toelichting
