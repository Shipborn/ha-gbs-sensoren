# =====================================================================
#  GBS sensoren – dashboard (YAML-modus)
#  Aangemeld via 'lovelace:' in packages/gbs_sensoren.yaml
# =====================================================================
title: GBS Sensoren
views:
  # ------------------------------------------------------------ OVERZICHT
  - title: Overzicht
    path: overzicht
    icon: mdi:view-dashboard
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Alle sensoren
          - type: markdown
            grid_options:
              columns: full
            content: |
              | | Sensor | Locatie | Temp | Vocht | Druk | Batterij |
              |---|---|---|---|---|---|---|
              {% for id in ['t1', 't2', 't3', 't4', 'a1', 'a2', 'a3', 'a4', 'a5'] -%}
              {% set t = states('sensor.gbs_' ~ id ~ '_temperature') -%}
              {% set h = states('sensor.gbs_' ~ id ~ '_humidity') -%}
              {% set p = states('sensor.gbs_' ~ id ~ '_pressure') -%}
              {% set b = states('sensor.gbs_' ~ id ~ '_battery') -%}
              | {{ '🌡️' if id[0] == 't' else '🌬️' }} | **{{ id | upper }}** | {{ states('input_select.gbs_' ~ id ~ '_locatie') }} | {{ t ~ ' °C' if is_number(t) else '–' }} | {{ h ~ ' %' if is_number(h) else '–' }} | {{ p ~ ' hPa' if is_number(p) else '–' }} | {{ b ~ ' %' if is_number(b) else '–' }} |
              {% endfor %}
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Temperatuursondes (IP65)
      - type: grid
        cards:
          - type: heading
            heading: "T1 · Sonde (IP65, display)"
            heading_style: subtitle
          - type: picture-entity
            entity: sensor.gbs_t1_plaatsing
            name: "T1"
            show_name: true
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /gbs-sensoren/plaatsen
          - type: tile
            entity: sensor.gbs_t1_temperature
            name: Temperatuur
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.gbs_t1_battery
            name: Batterij
            grid_options:
              columns: 6
          - type: markdown
            content: "📍 {{ states('input_text.gbs_t1_toelichting') }}"
            visibility:
              - condition: state
                entity: input_text.gbs_t1_toelichting
