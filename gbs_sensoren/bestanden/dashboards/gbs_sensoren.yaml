  # ------------------------------------------------------------ PLAATSEN
  - title: Sensoren plaatsen
    path: plaatsen
    icon: mdi:map-marker-plus
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Stap 1 – kies de sensor"
          - type: tile
            entity: input_select.gbs_actieve_sensor
            name: Sensor
            grid_options:
              columns: 6
            features:
              - type: select-options
          - type: markdown
            grid_options:
              columns: 6
            content: |
              **T1–T4** = IP65 sonde met display · **A1–A5** = AirGuard TH Pressure

              Nu geselecteerd: **{{ states('input_select.gbs_actieve_sensor') }}**
              → huidige locatie: **{{ states('input_select.gbs_' ~ (states('input_select.gbs_actieve_sensor') | lower) ~ '_locatie') }}**
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_select.gbs_actieve_sensor
                state: "T1"
            card:
              type: entities
              title: "T1 – details"
              entities:
                - entity: input_select.gbs_t1_locatie
                  name: Locatie (ook via foto's hieronder)
                - entity: input_text.gbs_t1_toelichting
                  name: Toelichting (bv. 'bovenste plank, links')
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_select.gbs_actieve_sensor
                state: "T2"
            card:
              type: entities
