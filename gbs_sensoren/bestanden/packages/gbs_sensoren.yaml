# =====================================================================
#  GBS sensoren – package
#  4x SONOFF IP65 Zigbee temperatuur met display (sonde)   -> T1..T4
#  5x SONOFF AirGuard TH Pressure (temp / vocht / luchtdruk) -> A1..A5
#
#  Verwachte entity-id's (na hernoemen van de Zigbee-apparaten naar
#  "GBS T1" ... "GBS A5", zie README):
#    sensor.gbs_t1_temperature, sensor.gbs_t1_battery
#    sensor.gbs_a1_temperature, sensor.gbs_a1_humidity,
#    sensor.gbs_a1_pressure,    sensor.gbs_a1_battery
#
#  Dit bestand wordt gemaakt door tools/genereer.py en neergezet door
#  de app "GBS Sensoren". Niet in HA zelf wijzigen: een update van de
#  app overschrijft het.
# =====================================================================

# Het dashboard in de zijbalk (bestand wordt door de app neergezet)
lovelace:
  dashboards:
    gbs-sensoren:
      mode: yaml
      title: GBS Sensoren
      icon: mdi:thermometer-lines
      show_in_sidebar: true
      filename: dashboards/gbs_sensoren.yaml

input_select:
  gbs_actieve_sensor:
    name: "GBS – sensor die je nu plaatst"
    icon: mdi:cursor-default-click
    options: ["T1", "T2", "T3", "T4", "A1", "A2", "A3", "A4", "A5"]
  gbs_t1_locatie:
    name: "GBS T1 – locatie"
    icon: mdi:thermometer-probe
    options: &locatie_opties
      - "Niet geplaatst"
      - "Binnen voorzijde"
      - "Binnen midden"
      - "Binnen achterzijde"
      - "Plafond"
      - "Vloer"
      - "Koelunit inblaas"
      - "Koelunit retour"
      - "Deur"
      - "Buiten"
      - "Technische ruimte"
  gbs_t2_locatie:
    name: "GBS T2 – locatie"
    icon: mdi:thermometer-probe
    options: *locatie_opties
  gbs_t3_locatie:
    name: "GBS T3 – locatie"
    icon: mdi:thermometer-probe
    options: *locatie_opties
  gbs_t4_locatie:
    name: "GBS T4 – locatie"
    icon: mdi:thermometer-probe
    options: *locatie_opties
  gbs_a1_locatie:
    name: "GBS A1 – locatie"
    icon: mdi:home-thermometer
    options: *locatie_opties
  gbs_a2_locatie:
    name: "GBS A2 – locatie"
    icon: mdi:home-thermometer
    options: *locatie_opties
  gbs_a3_locatie:
    name: "GBS A3 – locatie"
    icon: mdi:home-thermometer
    options: *locatie_opties
  gbs_a4_locatie:
    name: "GBS A4 – locatie"
    icon: mdi:home-thermometer
    options: *locatie_opties
  gbs_a5_locatie:
    name: "GBS A5 – locatie"
    icon: mdi:home-thermometer
    options: *locatie_opties

input_text:
  gbs_t1_toelichting:
    name: "GBS T1 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_t2_toelichting:
    name: "GBS T2 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_t3_toelichting:
    name: "GBS T3 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_t4_toelichting:
    name: "GBS T4 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_a1_toelichting:
    name: "GBS A1 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_a2_toelichting:
    name: "GBS A2 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_a3_toelichting:
    name: "GBS A3 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_a4_toelichting:
    name: "GBS A4 – toelichting plaatsing"
    icon: mdi:text
    max: 255
  gbs_a5_toelichting:
    name: "GBS A5 – toelichting plaatsing"
    icon: mdi:text
    max: 255

script:
  gbs_locatie_toewijzen:
    alias: "GBS – locatie toewijzen aan actieve sensor"
    icon: mdi:map-marker-check
    mode: queued
    fields:
      locatie:
        name: Locatie
        required: true
        example: "Binnen voorzijde"
        selector:
          text:
    sequence:
      - action: input_select.select_option
        target:
          entity_id: "input_select.gbs_{{ states('input_select.gbs_actieve_sensor') | lower }}_locatie"
        data:
          option: "{{ locatie }}"
      - action: persistent_notification.create
        data:
          notification_id: gbs_locatie_toegewezen
          title: "Sensor geplaatst"
          message: "{{ states('input_select.gbs_actieve_sensor') }} staat nu op: {{ locatie }}"

template:
  - sensor:
      # T1: state = gekozen locatie, picture = foto van die locatie
      - name: "GBS T1 plaatsing"
        unique_id: gbs_t1_plaatsing
        icon: mdi:map-marker
        state: "{{ states('input_select.gbs_t1_locatie') }}"
        picture: "/local/sensorlocaties/{{ states('input_select.gbs_t1_locatie') | slugify }}.jpg"
        attributes:
          soort: "Sonde (IP65, display)"
          toelichting: "{{ states('input_text.gbs_t1_toelichting') }}"
          temperatuur: "{{ states('sensor.gbs_t1_temperature') }}"
          batterij: "{{ states('sensor.gbs_t1_battery') }}"
      # T2: state = gekozen locatie, picture = foto van die locatie
      - name: "GBS T2 plaatsing"
        unique_id: gbs_t2_plaatsing
