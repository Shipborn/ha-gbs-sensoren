# Controleert bij elke push of de configuratie geldig is in Home Assistant.
name: HA config check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bestanden die op HA zelf bestaan maar niet in git staan
      - name: Placeholder-bestanden aanmaken
        run: |
          echo "[]" > automations.yaml
          echo "{}" > scripts.yaml
          echo "[]" > scenes.yaml
          mkdir -p themes
          echo "{}" > "$RUNNER_TEMP/fake_secrets.yaml"

      - name: Home Assistant configuratie controleren
        uses: frenck/action-home-assistant@v1
        with:
          path: "."
          secrets: ${{ runner.temp }}/fake_secrets.yaml
          version: stable
