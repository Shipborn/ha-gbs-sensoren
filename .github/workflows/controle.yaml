# Bij elke push: app-manifest controleren, de app-installatie nadoen op een
# lege HA-config en die config laten controleren door Home Assistant zelf.
name: Controle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./gbs_sensoren"

  ha-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verse HA-config maken en de app-installatie nadoen
        run: |
          mkdir -p test-config
          printf 'default_config:\n\nfrontend:\n  themes: !include_dir_merge_named themes\n\nautomation: !include automations.yaml\nscript: !include scripts.yaml\nscene: !include scenes.yaml\n' > test-config/configuration.yaml
          echo "[]" > test-config/automations.yaml
          echo "{}" > test-config/scripts.yaml
          echo "[]" > test-config/scenes.yaml
          mkdir -p test-config/themes
          echo '{"auto_restart": false, "fotos_overschrijven": false}' > "$RUNNER_TEMP/opties.json"
          cd gbs_sensoren
          GBS_TEST=1 OPTIES="$RUNNER_TEMP/opties.json" BRON=bestanden APP_YAML=config.yaml \
            HULP=zet_packages_aan.py CONFIG_DIR="$GITHUB_WORKSPACE/test-config" bash run.sh
          cat "$GITHUB_WORKSPACE/test-config/configuration.yaml"
          echo "{}" > "$RUNNER_TEMP/fake_secrets.yaml"

      - name: Home Assistant configuratie controleren
        uses: frenck/action-home-assistant@v1
        with:
          path: "./test-config"
          secrets: ${{ runner.temp }}/fake_secrets.yaml
          version: stable
