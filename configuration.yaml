# =====================================================================
#  GBS – configuration.yaml (beheerd via GitHub + Git pull add-on)
#  Wijzig dit bestand in de repo, niet op HA zelf: de volgende pull
#  overschrijft lokale wijzigingen.
# =====================================================================

# Standaard HA-integraties (zoals bij een verse installatie)
default_config:

frontend:
  themes: !include_dir_merge_named themes

# Via de HA-UI gemaakte automations/scripts/scenes (niet in git)
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  # Alle bestanden in /config/packages/ worden automatisch geladen
  packages: !include_dir_named packages

lovelace:
  dashboards:
    gbs-sensoren:
      mode: yaml
      title: GBS Sensoren
      icon: mdi:thermometer-lines
      show_in_sidebar: true
      filename: dashboards/gbs_sensoren.yaml
